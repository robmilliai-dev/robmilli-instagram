name: Keep milli-ai.com awake
# milli-ai.com runs on Replit Autoscale, which sleeps with no traffic and pauses the
# Instagram scheduler and DM replies. This pings it every 5 minutes so posts fire on time.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping site and Instagram status
        run: |
          curl -sS -m 60 -o /dev/null -w "home %{http_code}\n" https://milli-ai.com/ || true
          curl -sS -m 60 https://milli-ai.com/api/instagram/status | head -c 400 || true
